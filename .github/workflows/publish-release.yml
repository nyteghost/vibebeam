---
name: Publish release
# Publishes the unsigned Windows portable ZIP (and the Arch Linux package when the run has one)
# from a successful CI build to this
# repository's Releases page, so Vibebeam's update check (and your own installs) have
# something to find. It never signs anything and does not use any secrets besides the
# built-in token.
#
# How to use it:
#   1. Run the "CI" workflow on the commit you want to release (Actions -> CI -> Run
#      workflow) and wait for it to finish. CI artifacts are kept for only one day.
#   2. Run this workflow with a tag such as v1.0.0. Leave "run_id" empty to use the newest
#      successful CI run that still has a portable ZIP, or paste a specific run id.
# If the release already exists, the ZIP is added to it (an existing file is replaced).

permissions:
  contents: write
  actions: read
  id-token: write      # for the build provenance attestation
  attestations: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v1.0.0
        required: true
        type: string
      run_id:
        description: CI run id to publish from (empty = newest successful run with a portable ZIP)
        required: false
        type: string
      prerelease:
        description: Mark the release as a pre-release
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Check the tag name
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' should look like v1.2.3 (optionally with a suffix such as -beta.1)."
            exit 1
          fi

      - name: Find the CI run
        id: find
        shell: bash
        run: |
          run_id="${RUN_ID_INPUT}"
          if [[ -n "${run_id}" && ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a number (the CI run id from its URL)."
            exit 1
          fi
          if [[ -z "${run_id}" ]]; then
            for candidate in $(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
              count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
                --jq '[.artifacts[] | select((.name | startswith("ci-portable-")) and (.expired | not))] | length')
              if [[ "${count}" -gt 0 ]]; then
                run_id="${candidate}"
                break
              fi
            done
          fi
          if [[ -z "${run_id}" ]]; then
            echo "::error::No successful CI run with an unexpired portable ZIP was found. Run the CI workflow first (artifacts are kept for one day)."
            exit 1
          fi
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)
          echo "Using CI run ${run_id} at commit ${sha}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Download the portable ZIP
        shell: bash
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          mkdir -p dl
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern 'ci-portable-*' --dir dl
          find dl -type f -name '*.zip' -print
          if [[ -z "$(find dl -type f -name '*.zip')" ]]; then
            echo "::error::The CI run has no portable ZIP artifact."
            exit 1
          fi

      - name: Download the Arch Linux package (optional)
        shell: bash
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          mkdir -p dl-arch
          if gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name build-Archlinux --dir dl-arch; then
            find dl-arch -type f -name '*.pkg.tar.zst' ! -name '*-debug-*' -print
          else
            echo "::warning::No Arch Linux package in this CI run; publishing the Windows ZIP only."
          fi

      # A signed statement (GitHub artifact attestation) that these exact files were published by this
      # workflow from this repository. Check a download with: gh attestation verify <file> -R nyteghost/vibebeam
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: |
            dl/**/*.zip
            dl-arch/**/*.pkg.tar.zst

      - name: Create or update the release
        shell: bash
        env:
          TARGET_SHA: ${{ steps.find.outputs.sha }}
        run: |
          mapfile -t assets < <(find dl -type f -name '*.zip'; find dl-arch -type f -name '*.pkg.tar.zst' ! -name '*-debug-*' 2>/dev/null)
          # Publish checksums so the Linux installer (and anyone downloading by hand) can verify
          # that a package is exactly what this workflow uploaded.
          mkdir -p sums
          : > sums/SHA256SUMS
          for asset in "${assets[@]}"; do
            (cd "$(dirname "${asset}")" && sha256sum "$(basename "${asset}")") >> sums/SHA256SUMS
          done
          assets+=(sums/SHA256SUMS)
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then flags+=(--prerelease); fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" \
              --target "${TARGET_SHA}" --title "${TAG}" --generate-notes "${flags[@]}"
          fi
          echo "Release ${TAG} now has:"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
